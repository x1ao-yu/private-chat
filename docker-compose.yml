# Optional — not required for local dev (pnpm dev + go run)
# For production: docker compose up --build --detach
# TLS/wss terminates at your outer reverse proxy / load balancer (see README "Deployment").
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # The only ingress is the frontend nginx, which appends the real client
    # address to X-Forwarded-For. Without this the limiter would key every client
    # on nginx's container address and per-IP limits would become global.
    # Never enable this when the backend is directly reachable: clients could
    # then forge the header to escape their own rate-limit bucket.
    environment:
      - TRUST_PROXY_XFF=true
    # internal only: the frontend nginx proxies /ws and /health (least exposure).
    # to inspect the backend directly, temporarily add "8080:8080" under ports.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:8080"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
