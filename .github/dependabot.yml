version: 2

# Grouping is what cuts the noise: routine minor+patch bumps arrive as ONE PR per
# ecosystem instead of a dozen single-package PRs. Majors deliberately stay
# individual — they can break this repo's exactly-pinned versions and the
# --frozen-lockfile CI install, so each deserves its own review and CI run.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # low on purpose: with exact pins and a frozen lockfile, a big backlog of open
    # bumps never gets worked off, it just clutters the PR list
    open-pull-requests-limit: 3
    ignore:
      # @types/node must track the runtime actually used by frontend/Dockerfile
      # (node:24-alpine) and CI (node-version: 24). A newer @types/node lets source
      # code typecheck against APIs the runtime does not have. Bump it together
      # with the runtime, never as a standalone dependency update.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
