name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # keep in sync with frontend/Dockerfile; a drifting package manager
          # silently changes resolution between CI and the shipped image
          version: 10.30.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Install frontend deps
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install go-jsonschema
        # pinned: `make check-generate` is a diff gate, so a floating generator
        # version would fail CI the day upstream changes its output format
        run: go install github.com/atombender/go-jsonschema@v0.24.1

      - name: Check generated protocol
        run: make check-generate

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Lint
        run: make lint

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # build both images (no push — no registry configured); keeps the
      # Dockerfiles and nginx config from rotting
      - name: Build images
        run: docker compose build
