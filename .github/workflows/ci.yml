name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR makes its in-flight run obsolete, so cancel it.
# main is excluded: when several dependabot PRs are merged back-to-back, each
# squash-merge produces a new main state that is only validated by a main run
# (each PR's own CI ran against an older base). Cancelling those would leave
# untested combinations on main and hide the first broken one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # keep in sync with frontend/Dockerfile; a drifting package manager
          # silently changes resolution between CI and the shipped image
          version: 10.30.1

      # v7 adopted via dependabot PR #4. If pnpm installs start missing their cache,
      # this is the first thing to check: v5+ changed how the package manager used
      # for caching is resolved, and this repo relies on the explicit `cache: pnpm`
      # + `cache-dependency-path` pair below rather than on auto-detection.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Install frontend deps
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install go-jsonschema
        # pinned: `make check-generate` is a diff gate, so a floating generator
        # version would fail CI the day upstream changes its output format
        run: go install github.com/atombender/go-jsonschema@v0.24.1

      - name: Check generated protocol
        run: make check-generate

      # Static checks first: they are the cheapest way to fail.
      - name: Lint (gofmt + go vet + tsc)
        run: make lint

      # `make test` runs the Go suite under -race. The concurrency test in
      # manager_test.go exists to pin the maxMembers check-then-act fix, and a
      # data race it cannot see would otherwise pass silently.
      - name: Test (vitest + go test -race)
        run: make test

      - name: Build
        run: make build

  # Gate: a red scan blocks the run. Rationale for each boundary:
  # - npm audits only --prod (runtime deps ship; devDeps like vitest/jsdom never
  #   reach users, so their advisories must not block a merge).
  # - govulncheck is pinned (unlike go-jsonschema, where the pin protects a diff
  #   gate's output): here the pin makes the *scanner* reproducible, while its
  #   advisory database is still fetched live — so a newly disclosed CVE fails
  #   main until the toolchain/deps are bumped. That failure is the point of the
  #   gate; fix by upgrading Go (go-version below floats on the 1.25 patch line)
  #   or the module. v1.7.0 is the newest release whose go.mod still builds with
  #   this repo's Go 1.25 (v1.8.0 requires Go >= 1.26).
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Install frontend deps
        run: pnpm --dir frontend install --frozen-lockfile --ignore-scripts

      - name: Audit npm dependencies
        run: pnpm --dir frontend audit --prod --audit-level=high

      - name: Audit Go modules (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          cd backend && govulncheck ./...

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # build both images (no push — no registry configured); keeps the
      # Dockerfiles and nginx config from rotting
      - name: Build images
        run: docker compose build
