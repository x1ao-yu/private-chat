server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # prod CSP: script-src 'self' (no unsafe-inline), dev may relax if Vite needs unsafe-eval
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /health {
        proxy_pass http://backend:8080;
    }
}
